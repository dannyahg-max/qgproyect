<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gracias por tu mensaje</title>

    <!-- Bootstrap (si tu proyecto lo usa) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Paleta del proyecto (opcional si ya usas un CSS global) -->
    <style>
        :root {
            --brand-1: #7A1E18;
            --brand-2: #C33C26;
            --accent: #E76F27;
            --accent-2: #F0A437;
            --olive: #5A4A22;

            --bg-1: #FAF6F0;
            --bg-2: #FFFDF8;

            --text-1: #1F1F1F;
            --text-2: #2B2B2B;

            --surface: #FFFFFF;
            --border-soft: #EADFD6;
        }

        body {
            background: var(--bg-1);
            color: var(--text-2);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .thankyou-container {
            max-width: 620px;
            margin: 70px auto;
            padding: 40px;
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            box-shadow: 0 8px 26px rgba(0,0,0,0.08);
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        .thankyou-icon {
            font-size: 3.8rem;
            color: var(--accent);
            margin-bottom: 12px;
        }

        h1 {
            font-weight: 700;
            color: var(--text-1);
        }

        p {
            font-size: 1rem;
            color: var(--text-2);
        }

        .btn-primary {
            background: var(--brand-1);
            border-color: var(--brand-1);
        }
        .btn-primary:hover {
            background: var(--brand-2);
            border-color: var(--brand-2);
        }

        .btn-outline-primary {
            color: var(--brand-1);
            border-color: var(--brand-1);
        }
        .btn-outline-primary:hover {
            background: var(--brand-1);
            color: #fff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="thankyou-container">
        <div class="thankyou-icon">🙏</div>

        <h1>¡Gracias por escribirnos!</h1>

        <p class="mt-3">
            Hemos recibido tu mensaje correctamente.  
            Nuestro equipo lo revisará y te responderá a la brevedad (24–48h).
        </p>

        <p class="small mt-3" style="color: var(--olive);">
            “Sé fiel en lo que el Señor ha puesto en tus manos.  
            Él es quien abre camino y sostiene cada paso.”
        </p>

        <div class="mt-4 d-flex justify-content-center flex-wrap gap-3">
            <a href="index.html" class="btn btn-primary px-4">
                Volver al sitio
            </a>

            <a href="#mision" class="btn btn-outline-primary px-4">
                Conocer la misión
            </a>
        </div>
    </div>

</body>
</html>
